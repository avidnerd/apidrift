# Version 2 of the miniature billing API. Exactly six differences from v1, one
# per change kind plus a subtree removal:
#
#   Customer.legacy_id     removed
#   Customer.address       removed, with both of its fields
#   Customer.tax_id        added, with both of its fields
#   Customer.email         became nullable
#   Customer.balance       integer -> string
#   Charge.status          gained the enum value "disputed"
#   Error.error.code       stopped being required
openapi: 3.0.3
info:
  title: Billing API
  version: "2.0"
paths:
  /v1/customers/{customer}:
    get:
      responses:
        "200":
          description: the customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        "404":
          description: no such customer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/charges:
    get:
      responses:
        "200":
          description: a page of charges
          content:
            application/json:
              schema:
                type: object
                required: [object, data]
                properties:
                  object:
                    type: string
                  has_more:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Charge'
components:
  schemas:
    Customer:
      type: object
      required: [id, object, email, balance]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [customer]
        email:
          type: string
          nullable: true
        balance:
          type: string
        tax_id:
          type: object
          required: [value, country]
          properties:
            value:
              type: string
            country:
              type: string
    Charge:
      type: object
      required: [id, amount, status]
      properties:
        id:
          type: string
        amount:
          type: integer
        status:
          type: string
          enum: [disputed, failed, pending, succeeded]
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message]
          properties:
            code:
              type: string
            message:
              type: string
